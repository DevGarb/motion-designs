<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Trilha de Carreira</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css?v=3">
<style>
html,body{overflow:hidden}
.where{display:flex;gap:14px;align-items:center}
.where span:first-child{color:var(--text)}
.top .left{display:flex;align-items:center;gap:18px}

/* rodapé: progresso e controles */
.bottom{position:fixed;left:0;right:0;bottom:0;z-index:5;height:76px;display:flex;align-items:center;gap:24px;padding:0 40px}
.progress{flex:1;display:flex;gap:6px}
.progress button{flex:1;height:22px;border:0;background:none;cursor:pointer;position:relative}
.progress button::before,.progress button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px}
.progress button::before{background:var(--line2)}
.progress button::after{background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.progress button.done::after,.progress button.cur::after{transform:scaleX(1)}
.progress button:hover::before{background:var(--dim)}
.ctrl{display:flex;gap:8px}
.ctrl button{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ctrl button:hover{background:var(--panel2);border-color:var(--dim)}
.ctrl svg{width:16px;height:16px}

/* slides */
.deck{position:fixed;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:92px 64px 88px;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(3%) scale(.985);
  transition:opacity .5s var(--ease),transform .7s var(--ease),visibility 0s .7s}
.slide.past{transform:translateX(-3%) scale(.985)}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity calc(.7s * var(--sp)) var(--ease) calc(.1s * var(--sp)),transform calc(.9s * var(--sp)) var(--ease) calc(.1s * var(--sp)),visibility 0s}
.inner{width:min(1360px,100%);position:relative}
.hd h2{font-size:clamp(30px,3.4vw,54px);font-weight:800;letter-spacing:-.04em;line-height:1.02;margin-top:12px;max-width:26ch}
.hd{display:flex;justify-content:space-between;align-items:flex-end;gap:24px;flex-wrap:wrap}
.hd .pill{padding:10px 16px;border-radius:14px;border:1px solid color-mix(in oklab,var(--accent) 55%,transparent);background:color-mix(in oklab,var(--accent) 10%,transparent);max-width:420px}
.hd .pill b{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.hd .pill span{font-size:clamp(14px,1.15vw,18px);font-weight:700;letter-spacing:-.01em;line-height:1.25}

/* 1 · onde você está */
.pf{display:grid;grid-template-columns:6fr 5fr;gap:56px;align-items:center}
.pf h1{font-size:clamp(64px,9vw,150px);font-weight:800;letter-spacing:-.055em;line-height:.86;margin:16px 0 22px}
.resumo{font-size:clamp(15px,1.3vw,20px);color:var(--muted);line-height:1.5;max-width:50ch}
.frase{display:flex;align-items:center;gap:14px;margin-top:20px;font-size:clamp(16px,1.4vw,22px);font-weight:600;letter-spacing:-.01em;max-width:36ch;line-height:1.25}
.frase::before{content:"";flex:none;width:4px;height:44px;border-radius:3px;background:var(--accent)}
.lema{display:inline-flex;align-items:center;gap:10px;margin-top:24px;padding:9px 16px;border-radius:999px;border:1px solid color-mix(in oklab,var(--gold) 45%,transparent);background:color-mix(in oklab,var(--gold) 8%,transparent);font-family:var(--mono);font-size:12px;letter-spacing:.08em;color:var(--gold)}
.hoje{padding:22px 24px;border-radius:22px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.hoje h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-bottom:12px;display:flex;align-items:center;gap:8px}
.hoje h3.m{color:var(--accent)} .hoje h3.e{color:var(--gold)}
.hoje ul{list-style:none;display:grid;gap:8px;margin-bottom:20px}
.hoje ul:last-child{margin-bottom:0}
.hoje li{display:flex;align-items:center;gap:12px;font-size:clamp(15px,1.2vw,19px);font-weight:600;letter-spacing:-.01em}
.hoje li svg{width:18px;height:18px;flex:none;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.hoje .m+ul svg{stroke:var(--accent)} .hoje .e+ul svg{stroke:var(--gold)}
.goal{margin-top:4px;padding:18px 20px;border-radius:16px;border:1px solid color-mix(in oklab,var(--accent) 55%,transparent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
.goal b{display:block;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:6px}
.goal span{display:block;font-size:clamp(18px,1.6vw,26px);font-weight:800;letter-spacing:-.02em;line-height:1.15}
.goal .mo{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;margin-top:14px}
.goal .mo i{display:block;height:5px;border-radius:3px;background:var(--line2);position:relative;overflow:hidden}
.goal .mo i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.on .goal .mo i::after{transform:none;transition:transform calc(.5s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(400ms * var(--sp)))}
.goal .mo em{font-style:normal;font-family:var(--mono);font-size:10px;color:var(--dim);display:block;margin-top:14px;text-align:center}
.rt{display:grid;gap:12px}
.stars{padding:14px 18px 15px;border-radius:16px;border:1px solid color-mix(in oklab,var(--gold) 45%,transparent);background:color-mix(in oklab,var(--gold) 7%,transparent)}
.stars svg{fill:var(--gold)}
.stars .sh{display:flex;align-items:center;justify-content:space-between;gap:12px}
.stars .sh b{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)}
.stars .sh b svg{width:14px;height:14px}
.stars .sh strong{display:flex;align-items:baseline;gap:6px;font-size:26px;font-weight:800;letter-spacing:-.03em;color:var(--gold);line-height:1}
.stars .sh small{font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.stars .mg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;margin-top:10px}
.stars .mm{padding:7px 3px 8px;border-radius:10px;border:1px solid var(--line2);text-align:center;transition:border-color .3s,background .3s}
.stars .mm em{display:block;font-style:normal;font-family:var(--mono);font-size:10px;font-weight:600;letter-spacing:.08em;color:var(--muted);margin-bottom:5px}
.stars .mm div{display:flex;justify-content:center;gap:2px}
.stars .mm.ok{border-color:color-mix(in oklab,var(--gold) 70%,transparent);background:color-mix(in oklab,var(--gold) 14%,transparent)}
.stars .mm.ok em{color:var(--gold)}
.stars .sx,.stars .sv{display:block;width:12px;height:12px;flex:none}
.stars .sx svg,.stars .sv svg{width:100%;height:100%;display:block}
.stars .sv svg{fill:none;stroke:var(--dim);stroke-width:1.8}
.stars .sx{transform:scale(0);transition:transform .2s}
.stars .sx svg{filter:drop-shadow(0 0 4px color-mix(in oklab,var(--gold) 60%,transparent))}
.on .stars .sx{transform:none;transition:transform calc(.5s * var(--sp)) cubic-bezier(.3,1.6,.5,1) calc((var(--d,0ms) * var(--sp)) + calc(250ms * var(--sp)))}
.stars .ft{display:flex;justify-content:space-between;gap:6px 12px;flex-wrap:wrap;margin-top:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:var(--muted)}
.stars .ft b{color:var(--gold);font-weight:600}

/* 2 e 3 · cartões de exemplos */
.ex{display:grid;gap:16px;margin-top:clamp(18px,3.4vh,34px)}
.xc{padding:20px 22px 22px;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column}
.xc .no{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;color:var(--c)}
.xc h4{font-size:clamp(19px,1.65vw,26px);font-weight:800;letter-spacing:-.025em;line-height:1.1;margin-top:8px}
.xc .ds{margin-top:8px;font-size:clamp(13px,1vw,15px);color:var(--muted);line-height:1.4}
.blk{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.blk b{display:flex;align-items:center;gap:8px;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.blk b svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.blk p{font-size:clamp(14px,1.08vw,16.5px);line-height:1.45}
.blk.lu p{font-style:italic;color:var(--text)}
.blk.mu b{color:var(--c)}
.blk.mu p{font-weight:600}
.treino{margin-top:auto;padding-top:14px}
.treino span{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:12px;border:1px solid color-mix(in oklab,var(--gold) 50%,transparent);background:color-mix(in oklab,var(--gold) 9%,transparent);font-size:clamp(13px,1vw,15px);font-weight:600;line-height:1.3}
.treino span em{font-style:normal;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold);flex:none}
.man .xc{--c:var(--accent);border-top:3px solid var(--accent)}
.evo .xc{--c:var(--gold);border-top:3px solid var(--gold)}

/* 4 · plano de 6 meses */
.trail{position:relative;height:190px;margin-top:clamp(14px,2.6vh,28px)}
.trail svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.tp-base{fill:none;stroke:var(--line2);stroke-width:3;stroke-dasharray:2 10;stroke-linecap:round}
.tp-pg{fill:none;stroke:var(--accent);stroke-width:5;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s;filter:drop-shadow(0 0 8px color-mix(in oklab,var(--accent) 70%,transparent))}
.on .tp-pg{stroke-dashoffset:0;transition:stroke-dashoffset calc(var(--T) * var(--sp)) linear calc(450ms * var(--sp))}
.stem{stroke:var(--line2);stroke-width:2;stroke-dasharray:3 6}
.node{transform-box:fill-box;transform-origin:center;opacity:.25;transform:scale(.6);transition:opacity .3s,transform .3s}
.on .node{opacity:1;transform:none;transition:opacity calc(.5s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp))),transform calc(.8s * var(--sp)) cubic-bezier(.3,1.6,.5,1) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp)))}
.node .o{fill:var(--bg);stroke:var(--accent);stroke-width:3}
.node text{font-family:var(--mono);font-size:11px;font-weight:600;fill:var(--text);text-anchor:middle;dominant-baseline:central}
.node.sum .o{fill:var(--accent);stroke:var(--bg)}
.node.sum text{fill:#0a0c11}
.node.sum .halo{fill:none;stroke:var(--accent);stroke-width:2;transform-box:fill-box;transform-origin:center;animation:halo 2.4s ease-out infinite}
@keyframes halo{0%{transform:scale(.8);opacity:.9}100%{transform:scale(1.9);opacity:0}}
.flag{position:absolute;left:0;top:0;width:0;height:0;offset-rotate:0deg;offset-distance:0%;transition:offset-distance .3s;z-index:3}
.on .flag{offset-distance:100%;transition:offset-distance calc(var(--T) * var(--sp)) linear calc(450ms * var(--sp))}
.flag svg{position:absolute;left:-6px;top:-60px;width:46px;height:62px;overflow:visible}
.flag .pn{transform-box:fill-box;transform-origin:left center;animation:wave 1.1s ease-in-out infinite alternate}
@keyframes wave{from{transform:skewY(-7deg) scaleX(1)}to{transform:skewY(7deg) scaleX(.86)}}
.steps{display:grid;grid-template-columns:repeat(6,1fr)}
.stepc{margin:0 6px;padding:14px 14px 16px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));display:flex;flex-direction:column}
.stepc .sn{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.14em;text-transform:uppercase;color:var(--accent)}
.stepc h4{font-size:clamp(15px,1.25vw,19px);font-weight:800;letter-spacing:-.02em;margin-top:5px;line-height:1.12}
.stepc p{margin-top:7px;font-size:clamp(12px,.92vw,14px);color:var(--muted);line-height:1.38}
.stepc .sg{margin-top:auto;padding-top:10px}
.stepc .sg span{display:block;padding:6px 9px;border-radius:10px;border:1px solid color-mix(in oklab,var(--accent) 45%,transparent);font-size:clamp(11px,.85vw,12.5px);line-height:1.3;color:var(--text)}
.stepc .sg em{display:block;font-style:normal;font-family:var(--mono);font-size:9.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.stepc.last{border-color:color-mix(in oklab,var(--accent) 60%,transparent);background:color-mix(in oklab,var(--accent) 10%,transparent)}
.stepc .sn{display:flex;align-items:center;justify-content:space-between;gap:6px}
.stepc .sn i{display:block;width:14px;height:14px;flex:none}
.stepc .sn i svg{width:100%;height:100%;display:block;fill:var(--gold);filter:drop-shadow(0 0 4px color-mix(in oklab,var(--gold) 70%,transparent))}
.stepc .sn i.at{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 2.2s infinite}
.stepc.ok{border-color:color-mix(in oklab,var(--gold) 60%,transparent)}
.stepc.ok .sn{color:var(--gold)}
.pact{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}
.pact div{display:flex;gap:14px;align-items:baseline;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:var(--panel)}
.pact b{flex:none;font-family:var(--mono);font-size:10.5px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent)}
.pact div.g b{color:var(--gold)}
.pact span{font-size:clamp(12.5px,.98vw,15px);line-height:1.4;color:var(--muted)}

@media (max-height:820px) and (min-width:901px){
  .slide{padding-top:84px;padding-bottom:80px}
  .trail{height:160px}
  .stepc p{font-size:12px}
}
@media (max-width:900px){
  .bottom{padding:0 16px}
  .where span:first-child{display:none}
  .top .brand{display:none}
  .slide{padding:84px 16px 88px;align-items:flex-start;overflow-y:auto}
  .pf{grid-template-columns:1fr;gap:24px}
  .ex{grid-template-columns:1fr!important}
  .trail{display:none}
  .steps{grid-template-columns:1fr;gap:10px;margin-top:18px}
  .stepc{margin:0}
  .pact{grid-template-columns:1fr}
  .ctrl .opt{display:none}
}
</style>
</head>
<body>
<div class="bg"><div class="glow"></div><div class="grid"></div><svg class="topo" id="topo" viewBox="-500 -500 1000 1000" aria-hidden="true"></svg><div class="scan"></div></div>

<header class="top">
  <div class="left">
    <a class="back" href="index.html" title="Voltar aos cards (Esc)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg>Cards</a>
    <div class="brand"><span class="pulse-dot"></span><b id="brandTxt"></b></div>
  </div>
  <div class="where"><span id="whereTxt"></span><span id="countTxt"></span></div>
</header>

<main class="deck" id="deck"></main>

<footer class="bottom">
  <nav class="progress" id="progress" aria-label="Slides"></nav>
  <div class="ctrl">
    <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="next" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="full" class="opt" title="Tela cheia (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</footer>

<script src="base.js?v=3"></script>
<script src="dados.js?v=3"></script>
<script>
(() => {
  const D = window.FEEDBACKS, { esc, pad } = window.MD;
  const id = new URLSearchParams(location.search).get("p");
  const p = D.pessoas.find(x => x.id === id);
  if (!p) { location.replace("index.html"); return; }
  const idx = D.pessoas.indexOf(p) + 1;
  document.documentElement.style.setProperty("--accent", p.cor);
  MD.topo(document.getElementById("topo"));

  const IC = {
    ok: '<svg viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
    up: '<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',
    lu: '<svg viewBox="0 0 24 24"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.6 10.8c.6.5 1 1.2 1 2V16h5.2v-.2c0-.8.4-1.5 1-2A6 6 0 0 0 12 3z"/></svg>',
    dia: '<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    mu: '<svg viewBox="0 0 24 24"><path d="M4 17l6-6 4 4 6-6M14 9h6v6"/></svg>',
    pr: '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>'
  };
  const kick = t => `<div class="kicker a" style="--d:0ms"><i></i>${t}</div>`;
  const sl = (label, html) => ({ label, html: `<div class="inner">${html}</div>` });

  /* ---------- 1 · onde você está ---------- */
  function s1() {
    const li = (arr, ic, d0) => arr.map((c, i) => `<li class="a" style="--d:${d0 + i * 90}ms">${ic}${esc(c.t)}</li>`).join("");
    return sl("Onde você está", `
      <div class="pf">
        <div>
          ${kick(`Feedback individual · ${pad(idx)} de ${pad(D.pessoas.length)} · ciclo ${esc(D.ciclo)}`)}
          <h1><span class="line"><span style="--d:120ms">${esc(p.nome)}<span class="acc">.</span></span></span></h1>
          <p class="resumo a" style="--d:300ms">${esc(p.resumo)}</p>
          ${p.frase ? `<div class="frase a" style="--d:440ms">${esc(p.frase)}</div>` : ""}
          <div class="lema a" style="--d:560ms">${esc(D.lema)} Eu direciono, a gente chega junto.</div>
        </div>
        <div class="rt">
        <div class="hoje a" style="--d:300ms">
          <h3 class="m">${IC.ok.replace("<svg", '<svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.4"')}Manter</h3>
          <ul>${li(p.manter, IC.ok, 420)}</ul>
          <h3 class="e">Evoluir</h3>
          <ul>${li(p.evoluir, IC.up, 620)}</ul>
          <div class="goal a" style="--d:820ms"><b>Meta até junho de 2027</b><span>${esc(p.meta)}</span>
            <div class="mo">${D.meses.map((m, i) => `<div><i style="--d:${900 + i * 140}ms"></i><em>${m}</em></div>`).join("")}</div>
          </div>
        </div>
        ${painelEstrelas()}
        </div>
      </div>`);
  }

  /* estrela de carreira: estrelas semanais por mês (4 = mês fechado, +1 passo) e destaques */
  function painelEstrelas() {
    const E = D.estrelas, st = MD.estrelas(p, E, D.meses), N = E.porPasso;
    const destaques = st.lista.filter(e => !(E.fontes.find(f => f.id === e.tipo) || {}).semanal).length;
    let k = 0;
    const meses = D.meses.map(m => {
      const c = st.mes[m] || { semana: 0, extra: 0 }, ok = c.semana >= N;
      const slots = Array.from({ length: Math.max(N, c.semana) }, (_, j) => j < c.semana
        ? `<span class="sx" style="--d:${1300 + (k++) * 70}ms">${MD.STAR}</span>`
        : `<span class="sv">${MD.STAR}</span>`).join("");
      return `<div class="mm ${ok ? "ok" : ""}" title="${m}: ${c.semana} de ${N} estrelas da semana${ok ? " · passo liberado" : ""}"><em>${m}</em><div>${slots}</div></div>`;
    }).join("");
    return `<div class="stars a" style="--d:1150ms">
      <div class="sh"><b>${MD.STAR}${esc(E.titulo)}</b><strong>${st.total}<small>estrela${st.total === 1 ? "" : "s"}</small></strong></div>
      <div class="mg">${meses}</div>
      <div class="ft"><span><b>${st.passos} de ${D.meses.length}</b> passos do PDI · ${N} no mês = +1 passo</span><span>Destaques <b>${destaques}</b></span></div>
    </div>`;
  }

  /* ---------- 2 · o que manter e multiplicar ---------- */
  function s2() {
    const n = p.manter.length;
    const cards = p.manter.map((c, i) => `
      <div class="xc a" style="--d:${300 + i * 140}ms">
        <span class="no">Ponto forte ${pad(i + 1)}</span>
        <h4>${esc(c.t)}</h4>
        <p class="ds">${esc(c.d)}</p>
        <div class="blk lu"><b>${IC.lu}Na prática</b><p>${esc(c.ex)}</p></div>
        <div class="blk mu"><b>${IC.mu}Como multiplicar</b><p>${esc(c.mult)}</p></div>
      </div>`).join("");
    return sl("O que manter", `
      <div class="hd">
        <div>${kick("Pontos fortes · continuar e multiplicar")}
          <h2 class="a" style="--d:120ms">O que já funciona, e como levar mais longe</h2></div>
      </div>
      <div class="ex man" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cards}</div>`);
  }

  /* ---------- 3 · o que evoluir ---------- */
  function s3() {
    const n = p.evoluir.length;
    const cards = p.evoluir.map((c, i) => `
      <div class="xc a" style="--d:${300 + i * 140}ms">
        <span class="no">A evoluir ${pad(i + 1)}</span>
        <h4>${esc(c.t)}</h4>
        <p class="ds">${esc(c.d)}</p>
        <div class="blk lu"><b>${IC.lu}Pense assim</b><p>${esc(c.ludico)}</p></div>
        <div class="blk"><b>${IC.dia}No dia a dia</b><p>${esc(c.dia)}</p></div>
        <div class="treino"><span><em>Treino</em>${esc(c.treino)}</span></div>
      </div>`).join("");
    return sl("O que evoluir", `
      <div class="hd">
        <div>${kick("Pontos a aperfeiçoar · com exemplos do dia a dia")}
          <h2 class="a" style="--d:120ms">Onde treinar, e como fica na prática</h2></div>
      </div>
      <div class="ex evo" style="grid-template-columns:repeat(${n},minmax(0,1fr))">${cards}</div>`);
  }

  /* ---------- 4 · plano de 6 meses ---------- */
  function s4() {
    const E = D.estrelas, st = MD.estrelas(p, E, D.meses);
    const cards = p.plano.map((s, i) => {
      const ok = i < st.passos, atual = i === st.passos;
      return `
      <div class="stepc a ${i === p.plano.length - 1 ? "last" : ""} ${ok ? "ok" : ""}"><div class="sn">Passo ${i + 1} · ${esc(s.m)}${ok ? `<i title="Passo liberado">${MD.STAR}</i>` : atual ? `<i class="at" title="Passo atual"></i>` : ""}</div><h4>${esc(s.t)}</h4><p>${esc(s.a)}</p>
        <div class="sg"><span><em>Sinal de avanço</em>${esc(s.s)}</span></div></div>`;
    }).join("");
    return sl("Plano Jan a Jun", `
      <div class="hd">
        <div>${kick(`Plano de ação · ${E.porPasso} estrelas no mês = +1 passo`)}
          <h2 class="a" style="--d:120ms">Jan a Jun 2027, um passo por mês</h2></div>
        <div class="pill a" style="--d:240ms"><b>Meta até junho</b><span>${esc(p.meta)}</span></div>
      </div>
      <div class="trail">
        <svg aria-hidden="true"></svg>
        <div class="flag"><svg viewBox="0 0 46 62"><path d="M6 60V4" stroke="#eef1f6" stroke-width="3" stroke-linecap="round"/><path class="pn" d="M8 5L40 14L8 25Z" fill="var(--accent)"/></svg></div>
      </div>
      <div class="steps">${cards}</div>
      <div class="pact a" style="--d:${3600 + 400}ms">
        <div><b>${esc(p.nome)}</b><span>${esc(D.compromisso.voce)}</span></div>
        <div class="g"><b>${esc(D.gestor)} · gestor</b><span>${esc(D.compromisso.gestor)}</span></div>
      </div>`);
  }

  const slides = [s1(), s2(), s3(), s4()];

  /* ---------- trilha: caminho, meses e bandeira ---------- */
  function drawTrail() {
    const el = document.querySelector(".trail"); if (!el) return;
    const W = el.clientWidth; if (!W) return;
    const m = p.plano.length, H = el.clientHeight || 190, cw = W / m, T = 3600;
    const P = [[0, H - 12]];
    for (let i = 0; i < m; i++) {
      const base = H - 62 - (H - 62 - 54) * (i / (m - 1)), wv = i === m - 1 ? 0 : (i % 2 ? -20 : 14);
      P.push([(i + .5) * cw, base + wv]);
    }
    const c = MD.curve(P, 16);
    let svg = `<path class="tp-base" d="${c.d}"/><path class="tp-pg" pathLength="1" d="${c.d}"/>`;
    const cards = document.querySelectorAll(".steps .stepc");
    for (let j = 1; j <= m; j++) {
      const [x, y] = P[j], fr = c.L[Math.min(j * c.K, c.L.length - 1)] / c.total, dl = Math.round(fr * T);
      const X = x.toFixed(1), Y = y.toFixed(1), last = j === m;
      svg += `<line class="stem" x1="${X}" y1="${(y + 22).toFixed(1)}" x2="${X}" y2="${H}"/>`;
      svg += `<g class="node ${last ? "sum" : ""}" style="--d:${dl}ms">${last ? `<circle class="halo" cx="${X}" cy="${Y}" r="21"/>` : ""}<circle class="o" cx="${X}" cy="${Y}" r="21"/><text x="${X}" y="${(y + .5).toFixed(1)}">${esc(p.plano[j - 1].m)}</text></g>`;
      if (cards[j - 1]) cards[j - 1].style.setProperty("--d", (dl + 250) + "ms");
    }
    el.querySelector("svg").innerHTML = svg;
    el.querySelector(".flag").style.setProperty("offset-path", `path('${c.d}')`);
  }

  /* ---------- render e navegação ---------- */
  const deck = document.getElementById("deck"), prog = document.getElementById("progress");
  const scan = document.querySelector(".bg .scan");
  document.getElementById("brandTxt").textContent = `Trilha de carreira · ${p.nome}`;
  document.title = `Trilha de Carreira · ${p.nome}`;
  deck.innerHTML = slides.map((s, i) => `<section class="slide" data-i="${i}" aria-label="${esc(s.label)}">${s.html}</section>`).join("");
  prog.innerHTML = slides.map((s, i) => `<button title="${esc(s.label)}" aria-label="Ir para ${esc(s.label)}" data-goto="${i}"></button>`).join("");
  const els = [...deck.children], bars = [...prog.children];
  drawTrail();
  let rz; window.addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(drawTrail, 120); });

  let cur = -1;
  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === cur) return;
    cur = n;
    els.forEach((el, i) => { el.classList.toggle("on", i === n); el.classList.toggle("past", i < n); });
    bars.forEach((b, i) => { b.classList.toggle("done", i < n); b.classList.toggle("cur", i === n); });
    document.getElementById("whereTxt").textContent = slides[n].label;
    document.getElementById("countTxt").textContent = `${pad(n + 1)} / ${pad(slides.length)}`;
    scan.classList.remove("go"); void scan.offsetWidth; scan.classList.add("go");
    history.replaceState(null, "", location.search + "#" + (n + 1));
  }
  const next = () => go(cur + 1), prev = () => go(cur - 1);
  const full = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("full").onclick = full;
  document.addEventListener("click", e => { const t = e.target.closest("[data-goto]"); if (t) go(+t.dataset.goto); });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k === "Escape" && !document.fullscreenElement) location.href = "index.html";
    else if (k.toLowerCase() === "f") full();
    else if (/^[1-4]$/.test(k)) go(+k - 1);
  });
  let tx = null;
  deck.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); tx = null; });
  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return Number.isFinite(n) ? n - 1 : 0; };
  window.addEventListener("hashchange", () => go(fromHash()));
  setTimeout(() => go(fromHash()), 60);
})();
</script>
</body>
</html>
