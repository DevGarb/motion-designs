<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Resultados T.I · Ago a Out 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
@property --accent { syntax: '<color>'; inherits: true; initial-value: #60a5fa; }
:root{--sp:1.6;
  --bg:#0a0c11; --bg2:#11141c;
  --panel:rgba(255,255,255,.035); --panel2:rgba(255,255,255,.06);
  --line:rgba(255,255,255,.07); --line2:rgba(255,255,255,.14);
  --text:#eef1f6; --muted:#8e96aa; --dim:#596076;
  --accent:#60a5fa;
  --ant:#4d5a78; --bri:#8e96aa;
  --display:"Bricolage Grotesque", ui-sans-serif, system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
  --ease:cubic-bezier(.2,.8,.2,1);
  transition:--accent 1s ease;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:var(--display);overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}

/* fundo */
.bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.bg .glow{position:absolute;inset:-40%;
  background:
    radial-gradient(32% 30% at 68% 32%, color-mix(in oklab, var(--accent) 26%, transparent), transparent 70%),
    radial-gradient(26% 26% at 22% 78%, color-mix(in oklab, var(--accent) 12%, transparent), transparent 70%);
  animation:drift 26s ease-in-out infinite alternate}
.bg .grid{position:absolute;inset:0;
  background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 56px;
  -webkit-mask:radial-gradient(75% 70% at 50% 45%,#000 25%,transparent 80%);
          mask:radial-gradient(75% 70% at 50% 45%,#000 25%,transparent 80%);
  animation:pan 30s linear infinite}
.bg .scan{position:absolute;left:0;right:0;height:30vh;top:-30vh;
  background:linear-gradient(transparent, color-mix(in oklab, var(--accent) 7%, transparent), transparent)}
.bg .scan.go{animation:scan 1.4s var(--ease)}
@keyframes drift{to{transform:translate(-7%,5%) rotate(7deg)}}
@keyframes pan{to{background-position:56px 56px}}
@keyframes scan{to{top:110vh}}

/* moldura */
.top,.bottom{position:fixed;left:0;right:0;z-index:5;display:flex;align-items:center;padding:0 40px}
.top{top:0;height:72px;justify-content:space-between;font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.brand{display:flex;align-items:center;gap:12px}
.brand b{color:var(--text);font-weight:600}
.pulse-dot{width:8px;height:8px;border-radius:50%;background:var(--accent);animation:ping 2.2s infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 70%,transparent)}100%{box-shadow:0 0 0 12px transparent}}
.where{display:flex;gap:14px;align-items:center}
.where span:first-child{color:var(--text)}
.bottom{bottom:0;height:76px;gap:24px}
.progress{flex:1;display:flex;gap:6px}
.progress button{flex:1;height:22px;border:0;background:none;cursor:pointer;position:relative}
.progress button::before,.progress button::after{content:"";position:absolute;left:0;right:0;top:9px;height:4px;border-radius:2px}
.progress button::before{background:var(--line2)}
.progress button::after{background:var(--c);transform:scaleX(0);transform-origin:left;transition:transform .6s var(--ease)}
.progress button.done::after,.progress button.cur::after{transform:scaleX(1)}
.progress button:hover::before{background:var(--dim)}
.ctrl{display:flex;gap:8px}
.ctrl button{height:38px;min-width:38px;padding:0 12px;border-radius:10px;border:1px solid var(--line2);background:var(--panel);cursor:pointer;display:grid;place-items:center;transition:background .2s,border-color .2s}
.ctrl button:hover{background:var(--panel2);border-color:var(--dim)}
.ctrl svg{width:16px;height:16px}

/* slides */
.deck{position:fixed;inset:0;z-index:1}
.slide{position:absolute;inset:0;padding:96px 64px 92px;display:flex;align-items:center;justify-content:center;
  opacity:0;visibility:hidden;transform:translateX(3%) scale(.985);
  transition:opacity .5s var(--ease),transform .7s var(--ease),visibility 0s .7s}
.slide.past{transform:translateX(-3%) scale(.985)}
.slide.on{opacity:1;visibility:visible;transform:none;transition:opacity calc(.7s * var(--sp)) var(--ease) calc(.1s * var(--sp)),transform calc(.9s * var(--sp)) var(--ease) calc(.1s * var(--sp)),visibility 0s}
.inner{width:min(1360px,100%);position:relative}

/* entrada em cascata */
.a{opacity:0;transform:translateY(26px);filter:blur(8px);transition:opacity .4s,transform .4s,filter .4s}
.on .a{opacity:1;transform:none;filter:none;transition:opacity calc(.8s * var(--sp)) var(--ease),transform calc(1s * var(--sp)) var(--ease),filter calc(.8s * var(--sp)) var(--ease);transition-delay:calc((var(--d,0ms) * var(--sp)) + calc(250ms * var(--sp)))}
.line{display:block;overflow:hidden;padding-bottom:.06em}
.line>span{display:block;transform:translateY(110%);transition:transform .4s}
.on .line>span{transform:none;transition:transform calc(1.1s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(250ms * var(--sp)))}
.kicker{font-family:var(--mono);font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:12px}
.kicker i{width:28px;height:1px;background:var(--accent)}
.outline{color:transparent;-webkit-text-stroke:2px var(--accent)}
.acc{color:var(--accent)}
.fonte{margin-top:26px;font-family:var(--mono);font-size:11px;letter-spacing:.06em;color:var(--dim);line-height:1.6;max-width:110ch}

/* capa */
.capa h1{font-size:clamp(64px,min(11vw,20vh),190px);font-weight:800;line-height:.88;letter-spacing:-.05em;margin:22px 0 28px}
.capa .lead{font-size:clamp(18px,1.7vw,26px);color:var(--muted);max-width:36ch;line-height:1.4}
.chips{display:flex;flex-wrap:wrap;gap:10px;margin-top:34px}
.chip{padding:8px 15px;border-radius:999px;border:1px solid var(--line2);background:var(--panel);font-size:clamp(13px,1vw,15px);display:inline-flex;align-items:center;gap:9px}
.chip i{width:7px;height:7px;border-radius:50%;background:var(--accent);box-shadow:0 0 10px var(--accent)}
.chip.dash{border-style:dashed;color:var(--muted)}

/* layout dividido */
.split{display:grid;grid-template-columns:5fr 8fr;gap:56px;align-items:center}
.split.inv{grid-template-columns:5fr 7fr}
.split h2{font-size:clamp(30px,3.2vw,52px);font-weight:800;letter-spacing:-.035em;line-height:1;margin:16px 0 18px}
.big{display:block;font-size:clamp(84px,11vw,176px);font-weight:800;letter-spacing:-.055em;line-height:.85;color:var(--accent);margin:18px 0 14px}
.big small{font-size:.38em;letter-spacing:-.02em;color:var(--text);font-weight:600}
.desc{font-size:clamp(17px,1.45vw,22px);color:var(--muted);line-height:1.4;max-width:30ch}
.delta{display:inline-flex;align-items:center;gap:10px;margin-top:22px;padding:9px 16px;border-radius:999px;font-family:var(--mono);font-size:clamp(12px,1vw,14px);letter-spacing:.04em;
  border:1px solid color-mix(in oklab,var(--accent) 55%,transparent);background:color-mix(in oklab,var(--accent) 12%,transparent)}
.facts{display:grid;gap:10px;margin-top:26px;max-width:460px}
.fact{display:flex;gap:14px;align-items:baseline;padding:12px 16px;border-radius:14px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.fact b{font-size:clamp(20px,1.8vw,28px);font-weight:800;letter-spacing:-.02em;color:var(--text);white-space:nowrap}
.fact span{font-size:clamp(13px,1vw,15px);color:var(--muted);line-height:1.35}
.fact.hl b{color:#ffd24a}

/* gráficos svg */
.chart{width:100%;height:auto;display:block;overflow:visible;max-height:calc(100vh - 230px)}
.chart text{font-family:var(--display)}
.chart .mt{font-family:var(--mono)}
.c-ant{fill:var(--ant)} .c-bri{fill:var(--bri)} .c-acc{fill:var(--accent)}
.bar{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);transition:transform .3s}
.on .bar{transform:none;transition:transform calc(1.1s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp)))}
.fade{opacity:0;transition:opacity .3s}
.on .fade{opacity:1;transition:opacity calc(.7s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp)))}
.pop{opacity:0;transform:scale(.3);transform-box:fill-box;transform-origin:center;transition:opacity .3s,transform .3s}
.on .pop{opacity:1;transform:none;transition:opacity calc(.5s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp))),transform calc(.8s * var(--sp)) cubic-bezier(.3,1.6,.5,1) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp)))}
.draw{fill:none;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s}
.on .draw{stroke-dashoffset:0;transition:stroke-dashoffset calc(1.4s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(450ms * var(--sp)))}
.val{font-size:30px;font-weight:800;text-anchor:middle;fill:var(--text);letter-spacing:-.02em}
.mon{font-size:21px;font-weight:600;text-anchor:middle;fill:var(--muted)}
.mon.now{fill:var(--text)}
.pill-t{font-family:var(--mono);font-size:15px;font-weight:600;text-anchor:middle;fill:#fff}
.tag-t{font-family:var(--mono);font-size:14px;font-weight:600;text-anchor:middle;letter-spacing:.04em}
.brk{fill:none;stroke-width:2.2}
.legend{display:flex;gap:22px;flex-wrap:wrap;margin-top:8px;font-family:var(--mono);font-size:12px;letter-spacing:.06em;color:var(--muted)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:8px;vertical-align:-1px}

/* NPS */
.npsrow{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.ring{position:relative;padding:22px 12px 18px;border-radius:20px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));text-align:center}
.ring.ant{border-style:dashed}
.ring .rw{position:relative;max-width:150px;margin:0 auto}
.ring svg{width:100%;height:auto;display:block}
.ring .trk{fill:none;stroke:var(--line2);stroke-width:9}
.ring .arc{fill:none;stroke:var(--accent);stroke-width:9;stroke-linecap:round;stroke-dasharray:1;stroke-dashoffset:1;transition:stroke-dashoffset .3s}
.ring.ant .arc{stroke:var(--ant)}
.on .ring .arc{stroke-dashoffset:var(--off);transition:stroke-dashoffset calc(1.6s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(500ms * var(--sp)))}
.ring .n{position:absolute;inset:0;display:grid;place-items:center;font-size:clamp(20px,1.7vw,28px);font-weight:800;letter-spacing:-.03em}
.ring .r{margin-top:14px;font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase}
.ring .s{margin-top:4px;font-size:clamp(12px,.95vw,14px);color:var(--muted)}
.stars{display:flex;gap:6px;margin-top:22px}
.stars svg{width:28px;height:28px;fill:var(--line2);transition:fill .3s}
.on .stars svg{fill:#ffd24a;transition:fill calc(.5s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(800ms * var(--sp)) + var(--i)*calc(140ms * var(--sp)))}

/* categorias */
.hbars{display:grid;gap:16px}
.hb .top2{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:7px}
.hb .nm{font-size:clamp(16px,1.35vw,21px);font-weight:600;color:var(--muted)}
.hb.lead .nm{color:var(--text);font-weight:800}
.hb .ct{font-size:clamp(20px,1.8vw,28px);font-weight:800;letter-spacing:-.02em}
.hb.lead .ct{color:#ffd24a}
.track{height:20px;border-radius:5px;background:rgba(255,255,255,.05);overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .3s}
.on .track i{transform:scaleX(var(--w));transition:transform calc(1.2s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(500ms * var(--sp)))}
.hb.lead .track i{background:#ffd24a}
.hb.alt .track i{background:var(--bri)}
.comp{margin-top:26px;padding:20px 22px;border-radius:18px;border:1px solid color-mix(in oklab,#ffd24a 40%,transparent);background:color-mix(in oklab,#ffd24a 6%,transparent);max-width:520px}
.comp h3{font-family:var(--mono);font-size:12px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:#ffd24a;margin-bottom:14px}
.cp{display:grid;grid-template-columns:1fr 46px;gap:4px 12px;align-items:center;margin-bottom:11px}
.cp b{font-size:clamp(14px,1.1vw,16px);font-weight:600}
.cp b em{display:block;font-style:normal;font-weight:400;font-size:12px;color:var(--muted);margin-top:2px}
.cp span{font-family:var(--mono);font-size:14px;text-align:right}
.cp .tr{grid-column:1/-1;height:6px;border-radius:3px;background:rgba(255,255,255,.07);overflow:hidden}
.cp .tr i{display:block;height:100%;background:#ffd24a;transform:scaleX(0);transform-origin:left;transition:transform .3s}
.on .cp .tr i{transform:scaleX(var(--w));transition:transform calc(1s * var(--sp)) var(--ease) calc((var(--d,0ms) * var(--sp)) + calc(700ms * var(--sp)))}

/* callout */
.call{margin-top:26px;max-width:440px;padding:18px 20px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.call b{display:block;font-size:clamp(26px,2.4vw,38px);font-weight:800;letter-spacing:-.03em;color:var(--accent)}
.call span{display:block;margin-top:6px;font-size:clamp(13px,1vw,15px);color:var(--muted);line-height:1.4}

/* custos e I.A SDR */
.big.md{font-size:clamp(64px,8.4vw,136px)}
.c-gold{fill:#ffd24a}
.hbars.tight{gap:12px}
.hb .nm em{font-style:normal;font-family:var(--mono);font-size:12px;letter-spacing:.04em;color:var(--dim);margin-left:12px;font-weight:400}
.hb.lic .track i{background:#ffd24a}
.hb.lic .ct{color:#ffd24a}
.nov{display:inline-block;margin-left:10px;padding:2px 9px;border-radius:999px;border:1px solid color-mix(in oklab,var(--accent) 60%,transparent);font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:600;vertical-align:2px}

.sbar{display:flex;height:46px;border-radius:12px;overflow:hidden;margin-top:22px}
.sbar span{display:flex;align-items:center;padding:0 14px;font-family:var(--mono);font-size:13px;font-weight:600;color:#fff;white-space:nowrap;overflow:hidden;width:0;transition:width .3s}
.on .sbar span{width:var(--w);transition:width calc(1.3s * var(--sp)) var(--ease) calc(1s * var(--sp))}
.big .was{font-size:.62em;color:var(--dim);letter-spacing:-.04em}
.big .arr{font-size:.5em;color:var(--muted);vertical-align:.12em}

.pgrid{display:grid;gap:11px}
.pr .pn{font-size:clamp(15px,1.2vw,18px);font-weight:700;margin-bottom:4px}
.pt{display:grid;grid-template-columns:52px 1fr 56px;align-items:center;gap:10px;margin-top:3px}
.pt .pl{font-family:var(--mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}
.pt .track{height:13px}
.pt .track.ant i{background:var(--ant)}
.pt b{font-size:clamp(15px,1.3vw,19px);font-weight:800;text-align:right;letter-spacing:-.02em}
.pt b.nil{color:var(--dim);font-weight:400}

.pgrid.w .pt{grid-template-columns:70px 1fr 96px}
.pgrid .pn{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.pn .vr.pu{color:var(--accent)}
.pn .vr.pd{color:#ffd24a}
.pn .vr.pz{color:var(--dim)}
.pn .vr{font-family:var(--mono);font-size:12px;font-weight:700;letter-spacing:.04em;color:#ffd24a}
.pn .vr.dn{color:#34d399}
.notas{margin-top:16px;padding:14px 18px;border-radius:14px;border:1px solid var(--line2);background:color-mix(in oklab,var(--accent) 4%,transparent)}
.notas h3{font-family:var(--mono);font-size:11px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:8px}
.notas ul{list-style:none;display:grid;gap:5px}
.notas li{position:relative;padding-left:14px;font-size:clamp(12px,.95vw,14px);line-height:1.4;color:var(--muted)}
.notas li::before{content:"";position:absolute;left:0;top:.6em;width:5px;height:5px;border-radius:50%;background:var(--accent)}
.notas li b{color:var(--text,#e8ecf5);font-weight:600}
.gr9{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.gr9 .it{padding:12px 14px 14px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.gr9 .it svg{display:block;width:100%;height:clamp(50px,11vh,130px);margin-bottom:10px}
.gr9 .it i{font-style:normal;font-family:var(--mono);font-size:12px;color:var(--accent);letter-spacing:.1em}
.gr9 .it b{display:block;margin-top:5px;font-size:clamp(14px,1.25vw,19px);font-weight:700;line-height:1.2}
.fim{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-top:clamp(22px,4vh,44px);max-width:1200px}
.fim .fk{padding:16px 16px 18px;border-radius:16px;border:1px solid var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel))}
.fim .fk b{display:block;font-size:clamp(26px,3.2vw,50px);font-weight:800;letter-spacing:-.04em;line-height:1;color:var(--accent)}
.fim .fk>span{display:block;margin-top:9px;font-size:clamp(12px,.95vw,15px);line-height:1.35;color:var(--muted)}
.fim-foot{margin-top:clamp(18px,3vh,34px);font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.comp.units{border-color:var(--line2);background:linear-gradient(180deg,var(--panel2),var(--panel));max-width:460px;margin-top:22px}
.comp.units h3{color:var(--muted)}
.comp.units .cp{grid-template-columns:1fr 78px}
.comp.units .cp .tr i{background:var(--accent)}

.mg{display:grid;grid-template-columns:minmax(150px,1.5fr) repeat(3,1fr) minmax(150px,1.5fr);border:1px solid var(--line2);border-radius:18px;overflow:hidden;background:linear-gradient(180deg,var(--panel2),var(--panel))}
.mg>div{padding:20px 14px;display:flex;align-items:center;justify-content:center;border-top:1px solid var(--line)}
.mg>.h{font-family:var(--mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:14px;border-top:0}
.mg>.n{justify-content:center;flex-direction:column;align-items:flex-start;gap:4px;font-weight:800;font-size:clamp(16px,1.4vw,21px)}
.mg>.n em{font-style:normal;font-weight:400;font-family:var(--mono);font-size:11px;color:var(--dim);letter-spacing:.03em}
.mg>.v{font-size:clamp(22px,2.4vw,36px);font-weight:800;letter-spacing:-.03em}
.mg>.t{font-family:var(--mono);font-size:13px;font-weight:600;text-align:center}
.mg>.t.ok{color:var(--accent)}
.mg>.t.bad{color:#ffd24a}

@media (max-width:900px){
  .top,.bottom{padding:0 16px}
  .where span:last-child{display:none}
  .slide{padding:84px 16px 88px;align-items:flex-start;overflow-y:auto}
  .split,.split.inv{grid-template-columns:1fr;gap:24px}
  .npsrow{grid-template-columns:repeat(3,1fr)}
  .ctrl .opt{display:none}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important}
  .a{filter:none!important;transform:none!important}
}
</style>
</head>
<body>
<div class="bg"><div class="glow"></div><div class="grid"></div><div class="scan"></div></div>

<header class="top">
  <div class="brand"><span class="pulse-dot"></span><b id="brandTxt"></b></div>
  <div class="where"><span id="whereTxt"></span><span id="countTxt"></span></div>
</header>

<main class="deck" id="deck"></main>

<footer class="bottom">
  <nav class="progress" id="progress" aria-label="Slides"></nav>
  <div class="ctrl">
    <button id="prev" aria-label="Anterior"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 18l-6-6 6-6"/></svg></button>
    <button id="next" aria-label="Próximo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18l6-6-6-6"/></svg></button>
    <button id="full" class="opt" title="Tela cheia (F)"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg></button>
  </div>
</footer>

<script src="dados.js"></script>
<script>
(() => {
  const D = window.RESULTADOS, G = D.grti;
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const pad = n => String(n).padStart(2, "0");
  const br = (v, dec = 0) => v.toLocaleString("pt-BR", { minimumFractionDigits: dec, maximumFractionDigits: dec });
  const pct = (a, b) => { const v = (a / b - 1) * 100; return (v >= 0 ? "+" : "−") + br(Math.abs(v), 1) + "%"; };
  const hm = m => Math.floor(m / 60) + "h" + String(Math.round(m % 60)).padStart(2, "0");
  const MESES = D.meses;
  const COR = i => i < 3 ? "c-ant" : i === 3 ? "c-bri" : "c-acc";

  // pílula de variação dentro de svg
  function pill(cx, y, txt, up) {
    const w = txt.length * 9.6 + 22;
    return `<g class="fade"><rect x="${cx - w / 2}" y="${y}" width="${w}" height="28" rx="7" fill="${up ? "var(--accent)" : "#33405e"}"/>
      <text class="pill-t" x="${cx}" y="${y + 19}">${txt}</text></g>`;
  }
  const cnt = (to, o = {}) => `<span class="cnt" data-to="${to}" data-dec="${o.dec || 0}" data-pre="${o.pre || ""}" data-suf="${o.suf || ""}" data-fmt="${o.fmt || ""}">${o.txt}</span>`;

  /* ---------- 1. capa ---------- */
  function capa() {
    return { label: "Abertura", cor: G.cor, html: `
      <div class="inner capa">
        <div class="kicker a" style="--d:0ms"><i></i>${esc(D.equipe)} · ${esc(D.empresa)}</div>
        <h1>
          <span class="line"><span style="--d:80ms">${esc(D.titulo[0])}</span></span>
          <span class="line"><span style="--d:200ms" class="outline">${esc(D.titulo[1])}</span></span>
        </h1>
        <p class="lead a" style="--d:420ms">${esc(D.periodo)}. ${esc(D.subtitulo)}</p>
        <div class="chips a" style="--d:600ms">
          <span class="chip"><i></i>01 · GRTI</span>
          <span class="chip"><i></i>02 · Custos</span>
          <span class="chip"><i></i>03 · Inteligência Artificial</span>
          <span class="chip"><i></i>04 · Automações e Sistemas</span>
          <span class="chip"><i></i>05 · Entregas do trimestre</span>
        </div>
      </div>` };
  }

  /* slide de transição entre blocos (reaproveita o estilo da capa) */
  function trans(label, cor, kicker, t1, t2, lead) {
    return { label, cor, html: `
      <div class="inner capa">
        <div class="kicker a" style="--d:0ms"><i></i>${esc(kicker)}</div>
        <h1>
          <span class="line"><span style="--d:80ms">${esc(t1)}</span></span>
          <span class="line"><span style="--d:200ms" class="outline">${esc(t2)}</span></span>
        </h1>
        <p class="lead a" style="--d:420ms">${esc(lead)}</p>
      </div>` };
  }

  /* ---------- 2. chamados ---------- */
  function chamados() {
    const C = G.chamados, v = C.valores;
    const W = 1000, H = 440, top = 130, base = 340, max = 540, bw = 88, step = W / 7, x = i => step * i + step / 2;
    let s = "";
    v.forEach((n, i) => {
      const h = (n / max) * (base - top), d = i * 90;
      s += `<rect class="bar ${COR(i)}" x="${x(i) - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="6" style="--d:${d}ms"/>
        <text class="val fade" x="${x(i)}" y="${base - h - 14}" style="--d:${d + 500}ms">${n}</text>
        <text class="mon ${i >= 4 ? "now" : ""}" x="${x(i)}" y="${base + 36}">${MESES[i]}</text>`;
      s += i ? pill(x(i), base + 52, pct(v[i], v[i - 1]), v[i] >= v[i - 1]).replace('class="fade"', `class="fade" style="--d:${d + 700}ms"`) : `<text class="mt fade" x="${x(i)}" y="${base + 72}" text-anchor="middle" fill="#596076" font-size="15">—</text>`;
    });
    const bracket = (a, b, txt, cor, d) => {
      const x1 = x(a) - bw / 2, x2 = x(b) + bw / 2, y = 62;
      return `<path class="brk draw" pathLength="1" d="M${x1},${y + 14} L${x1},${y} L${x2},${y} L${x2},${y + 14}" stroke="${cor}" style="--d:${d}ms"/>
        <text class="fade" x="${(x1 + x2) / 2}" y="${y - 12}" text-anchor="middle" font-size="22" font-weight="800" fill="${cor}" style="--d:${d + 400}ms">${txt}</text>`;
    };
    s += bracket(0, 2, "média " + C.mediaAnterior, "#b8c6e6", 900);
    s += bracket(4, 6, "média " + C.mediaAtual + " · +" + br(C.crescimento, 1) + "%", "#ffffff", 1100);
    s += `<text class="tag-t fade" x="${x(3)}" y="96" fill="#8e96aa" style="--d:1000ms">▲ PICO DA SÉRIE</text>
          <text class="tag-t fade" x="${x(5)}" y="108" fill="#ffd24a" style="--d:1300ms">★ MAIOR DO TRIMESTRE</text>`;
    return { label: "GRTI · Chamados", cor: G.cor, html: `
      <div class="inner split">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>GRTI · Chamados</div>
          <span class="big a" style="--d:120ms">${cnt(C.mediaAtual, { txt: C.mediaAtual })}</span>
          <p class="desc a" style="--d:260ms">chamados por mês, na média de ago a out</p>
          <div class="delta a" style="--d:380ms">▲ ${cnt(C.crescimento, { dec: 1, pre: "+", suf: "%", txt: "+" + br(C.crescimento, 1) + "%" })} vs abr–jun (média ${C.mediaAnterior})</div>
          <div class="facts">
            <div class="fact hl a" style="--d:500ms"><b>${C.melhorMes.mes} · ${C.melhorMes.n}</b><span>mês com mais chamados do trimestre</span></div>
            <div class="fact a" style="--d:620ms"><b>${br(C.totalTrimestre)}</b><span>chamados abertos de ago a out · ${C.picoSerie.mes} (${C.picoSerie.n}) segue como pico da série</span></div>
          </div>
        </aside>
        <div>
          <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Chamados por mês, de abril a outubro">${s}</svg>
          <div class="legend a" style="--d:900ms"><span><i style="background:var(--ant)"></i>abr–jun</span><span><i style="background:var(--bri)"></i>jul (ponte)</span><span><i style="background:var(--accent)"></i>ago–out</span><span>% = variação vs mês anterior</span></div>
        </div>
      </div>` };
  }

  /* ---------- 3. NPS ---------- */
  function nps() {
    const N = G.nps, R = 52, L = 2 * Math.PI * R;
    const star = `<svg viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.3 5.8 21l1.6-7L2 9.3l7.1-.7z"/></svg>`;
    const rings = N.itens.map((it, i) => {
      const off = 1 - it.nota / 5;
      return `<div class="ring ${it.antigo ? "ant" : ""} a" style="--d:${300 + i * 110}ms">
        <div class="rw"><svg viewBox="0 0 120 120"><circle class="trk" cx="60" cy="60" r="${R}"/><circle class="arc" cx="60" cy="60" r="${R}" pathLength="1" transform="rotate(-90 60 60)" style="--off:${off.toFixed(4)};--d:${300 + i * 110}ms"/></svg>
        <div class="n">${br(it.nota, 2)}</div></div>
        <div class="r" style="color:${it.antigo ? "var(--muted)" : "var(--text)"}">${esc(it.rot)}</div>
        <div class="s">${esc(it.sub)}</div>
      </div>`;
    }).join("");
    return { label: "GRTI · Satisfação", cor: G.cor, html: `
      <div class="inner split inv">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>GRTI · Satisfação (NPS / CSAT)</div>
          <span class="big a" style="--d:120ms">${cnt(N.media, { dec: 2, txt: br(N.media, 2) })}<small> /5</small></span>
          <p class="desc a" style="--d:260ms">nota média de satisfação em ago–out</p>
          <div class="stars a" style="--d:380ms">${[0,1,2,3,4].map(i => `<span style="--i:${i}">${star}</span>`).join("")}</div>
          <div class="facts">
            <div class="fact a" style="--d:520ms"><b>${br(N.avaliacoes)}</b><span>avaliações no trimestre</span></div>
            <div class="fact a" style="--d:640ms"><b>~${N.taxaAvaliacao}%</b><span>dos chamados fechados recebem nota</span></div>
          </div>
        </aside>
        <div>
          <div class="npsrow">${rings}</div>
          <p class="fonte a" style="--d:1000ms">Nota de 1 a 5. Abr–jun: só a média do trimestre. Out fechou em 4,98; nov parcial em 4,97 (73 avaliações).</p>
        </div>
      </div>` };
  }

  /* ---------- 4. TMA ---------- */
  function tma() {
    const T = G.tma, m = T.minutos, W = 1000, H = 400, top = 110, base = 270, lo = 340, hi = 490, step = W / 7;
    const x = i => step * i + step / 2, y = v => base - ((v - lo) / (hi - lo)) * (base - top);
    const path = (a, b) => { let d = ""; for (let i = a; i <= b; i++) d += (i === a ? "M" : "L") + x(i) + "," + y(m[i]); return d; };
    const dx = (x(T.corteApos) + x(T.corteApos + 1)) / 2;
    let s = `<line class="fade" x1="${dx}" x2="${dx}" y1="46" y2="290" stroke="#596076" stroke-width="2" stroke-dasharray="4 7" style="--d:700ms"/>
      <text class="mt fade" x="${dx}" y="28" text-anchor="middle" font-size="13" fill="#8e96aa" letter-spacing="1" style="--d:800ms">REGRA DE CÁLCULO MUDOU</text>
      <path class="fade" d="${path(0, 2)}" fill="none" stroke="var(--ant)" stroke-width="5" stroke-dasharray="10 9" style="--d:300ms"/>
      <path class="draw" pathLength="1" d="${path(3, 6)}" stroke="var(--accent)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round" style="--d:500ms"/>`;
    m.forEach((v, i) => {
      const d = i * 110;
      s += `<circle class="pop ${COR(i)}" cx="${x(i)}" cy="${y(v)}" r="10" style="--d:${d}ms"/>
        <text class="val fade" x="${x(i)}" y="${y(v) - 22}" style="--d:${d + 300}ms">${T.rotulos[i]}</text>
        <text class="mon ${i >= 4 ? "now" : ""}" x="${x(i)}" y="${base + 50}">${MESES[i]}</text>`;
      if (i && i !== T.corteApos + 1) s += pill(x(i), base + 66, pct(v, m[i - 1]), v <= m[i - 1]).replace('class="fade"', `class="fade" style="--d:${d + 700}ms"`);
      else s += `<text class="mt fade" x="${x(i)}" y="${base + 86}" text-anchor="middle" fill="#596076" font-size="15">—</text>`;
    });
    return { label: "GRTI · TMA", cor: G.cor, html: `
      <div class="inner split">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>GRTI · Tempo médio de atendimento</div>
          <span class="big a" style="--d:120ms">${cnt(T.mediaAtual.minutos, { fmt: "hm", txt: T.mediaAtual.rotulo })}</span>
          <p class="desc a" style="--d:260ms">TMA médio em ago–out, pela regra atual do sistema</p>
          <div class="call a" style="--d:420ms"><b>${T.medianaOut} min</b><span>é quanto o chamado típico levou para fechar em out. Em ago e set foi ${T.medianaAgoSet} min. O TMA sobe com poucos chamados muito longos; a mediana mostra o dia a dia.</span></div>
        </aside>
        <div>
          <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="TMA por mês">${s}</svg>
          <div class="legend a" style="--d:900ms"><span><i style="background:var(--accent)"></i>% azul = TMA caiu (melhorou)</span><span><i style="background:#33405e"></i>% cinza = TMA subiu</span></div>
          <div class="notas a" style="--d:1000ms"><h3>Regra de cálculo</h3><ul>
            <li><b>Abr–jun:</b> o tempo contava desde que o técnico pegava o chamado, mesmo em aberto, até o cliente avaliar</li>
            <li><b>Jul em diante:</b> conta do início do atendimento até o fechamento pelo técnico (tempo corrido)</li>
            <li><b>Por que mudou:</b> o dado passa a refletir o tempo real do atendimento</li>
            <li><b>Comparação:</b> as duas regras não são comparáveis, por isso o corte no gráfico</li>
          </ul></div>
        </div>
      </div>` };
  }

  /* ---------- 5. categorias ---------- */
  function categorias() {
    const K = G.categorias, max = K.lista[0].n;
    const bars = K.lista.map((c, i) => `<div class="hb ${c.destaque ? "lead" : ""} ${c.nome.startsWith("Sistemas") ? "alt" : ""} a" style="--d:${200 + i * 100}ms">
      <div class="top2"><span class="nm">${c.destaque ? "★ " : ""}${esc(c.nome)}</span><span class="ct">${cnt(c.n, { txt: c.n })}</span></div>
      <div class="track"><i style="--w:${(c.n / max).toFixed(3)};--d:${200 + i * 100}ms"></i></div></div>`).join("");
    const comp = K.composicaoLider.map((c, i) => `<div class="cp"><b>${esc(c.nome)}${c.sub ? `<em>${esc(c.sub)}</em>` : ""}</b><span>${c.p}%</span>
      <div class="tr"><i style="--w:${(c.p / K.composicaoLider[0].p).toFixed(3)};--d:${i * 90}ms"></i></div></div>`).join("");
    return { label: "GRTI · O que mais pedem", cor: G.cor, html: `
      <div class="inner split inv">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>GRTI · Tipos de solicitação</div>
          <h2><span class="line"><span style="--d:80ms">Equipamento</span></span><span class="line"><span class="acc" style="--d:200ms">lidera os pedidos</span></span></h2>
          <p class="desc a" style="--d:380ms">Entre ${esc(K.periodo)}, o que mais chegou à T.I foi equipamento físico: periférico, entrega e troca.</p>
          <div class="comp a" style="--d:520ms"><h3>Dentro de Equipamentos & Logística</h3>${comp}</div>
        </aside>
        <div>
          <div class="hbars">${bars}</div>
        </div>
      </div>` };
  }

  /* ---------- Bloco 2 · custos ---------- */
  const CU = D.custos;
  const pc0 = (a, b) => { const v = (a / b - 1) * 100; return (v >= 0 ? "+" : "−") + br(Math.abs(v), 0) + "%"; };
  const cal = (() => {
    const sv = CU.servicos.map(s => {
      const v = s.usd ? s.usd.map(u => u * CU.cambio) : s.valores;
      return { ...s, v, med: v.reduce((a, b) => a + b, 0) / v.length };
    });
    const grp = (g, i) => sv.filter(s => s.grupo === g).reduce((a, s) => a + s.v[i], 0);
    const mes = CU.meses.map((m, i) => ({ m, infra: grp("infra", i), ferr: grp("ferr", i), total: grp("infra", i) + grp("ferr", i) }));
    const total = mes.reduce((a, x) => a + x.total, 0);
    return { sv, mes, total, mediaTotal: total / mes.length,
      mediaInfra: mes.reduce((a, x) => a + x.infra, 0) / mes.length, mediaFerr: mes.reduce((a, x) => a + x.ferr, 0) / mes.length };
  })();

  function custoGeral() {
    const M = cal.mes, tot = M.map(m => m.total);
    const svg = cols({ vals: M.map(m => m.ferr), v2: M.map(m => m.infra), labs: M.map(m => m.m), fv: v => "R$ " + br(v), now: () => true, pl: pls(tot), max: 4600,
      bk: [{ a: 0, b: 2, t: "média R$ " + br(cal.mediaTotal) + " por mês" }], aria: "Custo mensal de ferramentas e infra, de ago a out" });
    return { label: "Custos · Visão geral", cor: CU.cor, html: `
      <div class="inner split">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>Custos · Ferramentas e infra</div>
          <span class="big md a" style="--d:120ms"><small>R$ </small>${cnt(cal.mediaTotal, { txt: br(cal.mediaTotal) })}</span>
          <p class="desc a" style="--d:260ms">por mês, na média de ago a out</p>
          <div class="delta a" style="--d:380ms">R$ ${br(cal.total)} gastos no trimestre</div>
          <div class="facts">
            <div class="fact a" style="--d:500ms"><b>R$ ${br(cal.mediaFerr)}</b><span>ferramentas por mês: Lovable, Claude, OpenAI, ManyChat, UazAPI e ChatGPT</span></div>
            <div class="fact hl a" style="--d:620ms"><b>R$ ${br(cal.mediaInfra)}</b><span>infra por mês: VPS Hostinger e domínio</span></div>
            <div class="fact a" style="--d:740ms"><b>≈ R$ ${br(Math.round(cal.mediaTotal * 12 / 1000))} mil</b><span>por ano, mantido o ritmo de ago a out</span></div>
          </div>
        </aside>
        <div>
          ${svg}
          <div class="legend a" style="--d:900ms"><span><i style="background:var(--accent)"></i>ferramentas</span><span><i style="background:#ffd24a"></i>infra (VPS)</span><span>% = variação vs mês anterior</span></div>
          <p class="fonte a" style="--d:1000ms">Valores mensais de ago a out. OpenAI convertida a R$ 5,12 (média do dólar no ano). VPS e domínio são anuais, rateados em 12 meses.</p>
        </div>
      </div>` };
  }

  function custoServicos() {
    const L = [...cal.sv].sort((a, b) => b.med - a.med), max = L[0].med;
    const t2 = Math.round((L[0].med + L[1].med) / cal.mediaTotal * 100), t2v = L[0].med + L[1].med;
    const lov = cal.sv.find(s => s.curto === "Lovable"), oa = cal.sv.find(s => s.curto === "OpenAI");
    const cred = lov.creditos.reduce((a, b) => a + b, 0), lovTot = lov.v.reduce((a, b) => a + b, 0);
    const oaUsd = oa.usd.reduce((a, b) => a + b, 0) / oa.usd.length;
    const pf = cal.mediaFerr / cal.mediaTotal * 100;
    const rows = L.map((s, i) => {
      const sub = s.v.map(x => br(x)).join(" · ");
      return `<div class="hb ${s.grupo === "infra" ? "lic" : ""} a" style="--d:${200 + i * 90}ms">
        <div class="top2"><span class="nm">${esc(s.nome)}<em>${esc(sub)}</em></span><span class="ct">${cnt(s.med, { pre: "R$ ", txt: "R$ " + br(s.med) })}</span></div>
        <div class="track"><i style="--w:${(s.med / max).toFixed(3)};--d:${200 + i * 90}ms"></i></div></div>`;
    }).join("");
    return { label: "Custos · Por serviço", cor: CU.cor, html: `
      <div class="inner split inv">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>Custos · Por serviço</div>
          <h2><span class="line"><span style="--d:80ms">Dois serviços</span></span><span class="line"><span class="acc" style="--d:200ms">levam ${t2}%</span></span></h2>
          <p class="desc a" style="--d:380ms">${esc(L[0].curto)} e ${esc(L[1].curto)} somam R$ ${br(t2v)} dos R$ ${br(cal.mediaTotal)} mensais.</p>
          <div class="facts">
            <div class="fact a" style="--d:500ms"><b>${br(cred)}</b><span>créditos Lovable em ago–out (R$ ${br(lovTot)})</span></div>
            <div class="fact a" style="--d:620ms"><b>${br(pf, 0)}%</b><span>do custo mensal é ferramenta; a infra (VPS e domínio) é ${br(100 - pf, 0)}%</span></div>
            <div class="fact a" style="--d:740ms"><b>US$ ${br(oaUsd)}</b><span>OpenAI por mês, de US$ ${oa.usd[0]} em ago para US$ ${oa.usd[2]} em out</span></div>
          </div>
        </aside>
        <div>
          <div class="hbars tight">${rows}</div>
          <div class="legend a" style="--d:1000ms"><span><i style="background:var(--accent)"></i>ferramentas</span><span><i style="background:#ffd24a"></i>infra (VPS)</span><span>ao lado do nome: R$ em ago · set · out</span></div>
          <p class="fonte a" style="--d:1100ms">Média mensal de ago a out, em R$. Claude: 9 licenças (R$ 1.242/mês). VPS Hostinger e domínio: anuais, rateados em 12 meses.</p>
        </div>
      </div>` };
  }

  /* Comparativo de custos: só serviços que já existiam no trimestre anterior (ManyChat e UazAPI são novos e ficam fora). */
  function custoComp() {
    const L = cal.sv.filter(s => s.ant).sort((a, b) => b.med - a.med);
    const ant = L.reduce((a, s) => a + s.ant, 0), atu = L.reduce((a, s) => a + s.med, 0);
    const novos = cal.sv.filter(s => !s.ant).reduce((a, s) => a + s.med, 0);
    const max = Math.max(...L.map(s => s.med), ...L.map(s => s.ant));
    const oa = L.find(s => s.curto === "OpenAI"), lov = L.find(s => s.curto === "Lovable"), cl = L.find(s => s.curto === "Claude");
    const oaUsd = oa.usd.reduce((a, b) => a + b, 0) / oa.usd.length;
    const rows = L.map((s, k) => {
      const d = 200 + k * 110, up = s.med >= s.ant, nm = s.curto === "Claude" ? "Claude (API → 9 licenças)" : s.nome.replace(" + domínio", "");
      return `<div class="pr a" style="--d:${d}ms"><div class="pn"><span>${esc(nm)}</span><span class="vr ${up ? "" : "dn"}">${Math.abs(s.med / s.ant - 1) < 0.01 ? "= igual" : (up ? "▲ " : "▼ ") + pc0(s.med, s.ant).replace(/^[+−]/, "")}</span></div>
        <div class="pt"><span class="pl">Abr–Jun</span><div class="track ant"><i style="--w:${(s.ant / max).toFixed(3)};--d:${d}ms"></i></div><b>R$ ${br(s.ant)}</b></div>
        <div class="pt"><span class="pl">Ago–Out</span><div class="track"><i style="--w:${(s.med / max).toFixed(3)};--d:${d + 120}ms"></i></div><b>${cnt(s.med, { pre: "R$ ", txt: "R$ " + br(s.med) })}</b></div></div>`;
    }).join("");
    return sl("Custos · Comparativo", CU.cor, `
      ${kick("Custos · Trimestre anterior vs atual")}
      <span class="big md a" style="--d:120ms"><span class="was" style="display:block;line-height:1.05">R$ ${br(ant)} <span class="arr">→</span></span><small>R$ </small>${cnt(atu, { txt: br(atu) })}</span>
      <p class="desc a" style="--d:260ms">por mês, nos ${L.length} serviços que já existiam em abr–jun</p>
      <div class="delta a" style="--d:380ms">▲ ${pc0(atu, ant)} na média mensal (+R$ ${br(atu - ant)})</div>
      <div class="facts">
        ${fact("+R$ " + br(cl.med - cl.ant), "Claude: a API de R$ " + cl.ant + " saiu e entraram 9 licenças de R$ 1.242 por mês", 500, true)}
        ${fact(pc0(oa.med, oa.ant), `OpenAI: US$ ${br(oaUsd)} por mês, contra US$ ${oa.antUsd} no trimestre anterior`, 620)}
        ${fact(pc0(lov.med, lov.ant), "Lovable: R$ " + br(lov.med) + " por mês, contra R$ " + br(lov.ant), 740)}
      </div>`,
      `<div class="pgrid w">${rows}</div>
       ${legend(['<span><i style="background:var(--ant)"></i>abr–jun</span>', '<span><i style="background:var(--accent)"></i>ago–out</span>', "<span>média mensal em R$</span>"], 1100)}
       ${fonte("Abr–jun: estimativa mensal da época. Ago–out: média dos valores informados. ManyChat e UazAPI (R$ " + br(novos) + " por mês) são novos e ficam fora da comparação.", 1200)}`);
  }

  /* ---------- Custos da Meta (WhatsApp) por chip ---------- */
  function metaCusto() {
    const M = D.meta, C = M.chips, tm = C.reduce((a, c) => a + c.msgs, 0), tc = C.reduce((a, c) => a + c.custo, 0);
    const mil = c => c.custo / c.msgs * 1000, mx = Math.max(...C.map(c => c.custo));
    const mult = M.tarifa.marketing / M.tarifa.utilitaria;
    const fin = C.find(c => c.n === "Financeiro CearaGPS" && c.sub === "Ativos"), com = C.find(c => c.n === "Comercial CearaGPS");
    const rows = C.map((c, i) => hrow(c.n + (c.sub ? " · " + c.sub : ""), br(c.msgs) + " msgs · R$ " + br(mil(c), 0) + "/mil", "R$ " + br(c.custo), c.custo / mx, 300 + i * 90, c.mkt >= 0.5 ? "lead" : "")).join("");
    return sl("Custos · Meta (WhatsApp)", M.cor, `
      ${kick("Custos · WhatsApp Meta · " + M.periodo)}
      <span class="big md a" style="--d:120ms"><small>R$ </small>${cnt(tc, { txt: br(tc) })}</span>
      <p class="desc a" style="--d:260ms">de custo da Meta, em ${br(tm)} mensagens enviadas por ${C.length} chips</p>
      <div class="comp units a" style="--d:420ms"><h3>Tipo de template · custo por mensagem</h3>
        <div class="cp"><b>Utilitária e serviço</b><span>R$ ${br(M.tarifa.utilitaria, 3)}</span><div class="tr"><i style="--w:${(M.tarifa.utilitaria / M.tarifa.marketing).toFixed(3)};--d:200ms"></i></div></div>
        <div class="cp"><b>Marketing</b><span>R$ ${br(M.tarifa.marketing, 2)}</span><div class="tr"><i style="--w:1;--d:300ms;background:#ffd24a"></i></div></div>
      </div>
      <div class="facts">
        ${fact(br(mult, 0) + "×", "mais caro por mensagem no template de marketing. A T.I usa utilitária e serviço, de menor custo", 700, true)}
      </div>`,
      `<div class="hbars tight">${rows}</div>
       ${legend(['<span><i style="background:#ffd24a"></i>maior parte do custo vem de template de marketing</span>', '<span><i style="background:var(--accent)"></i>utilitária e serviço</span>'], 1000)}
       <div class="notas a" style="--d:1100ms"><h3>Comparativo</h3><ul>
         <li><b>Financeiro CearaGPS (Ativos):</b> R$ ${br(fin.custo)} para ${br(fin.msgs)} mensagens, com template utilitário</li>
         <li><b>Comercial CearaGPS:</b> R$ ${br(com.custo)} para ${br(com.msgs)} mensagens, com template de marketing</li>
         <li><b>Resultado:</b> gasto parecido, <b style="color:var(--accent)">${br(fin.msgs / com.msgs, 0)}× mais mensagens</b> e custo por mensagem até ${br(mult, 0)}× menor com o template certo</li>
         <li><b>Base:</b> ${M.periodo}, custo informado pela Meta por chip e categoria</li>
       </ul></div></ul></div>`);
  }

  /* ---------- Bloco 2 · I.A SDR ---------- */
  function iaSdr() {
    const S = D.iaSdr, v = S.serie.map(x => x.n), n = v.length, W = 1000, H = 440, base = 340, top = 120, max = 650, step = W / n, bw = 54, x = i => step * i + step / 2;
    const avg = a => a.reduce((s, i) => s + v[i], 0) / a.length;
    const mA = avg(S.idxAnterior), mN = avg(S.idxAtual);
    const yAvg = base - S.mediaAno / max * (base - top);
    let s = `<line class="fade" x1="0" x2="${W}" y1="${yAvg}" y2="${yAvg}" stroke="#8e96aa" stroke-width="1.5" stroke-dasharray="3 8" style="--d:1400ms"/>`;
    v.forEach((val, i) => {
      const h = val / max * (base - top), d = i * 60;
      const cls = S.idxAnterior.includes(i) ? "c-ant" : S.idxAtual.includes(i) ? "c-acc" : "c-bri";
      s += `<rect class="bar ${cls}" x="${x(i) - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="5" style="--d:${d}ms;${cls === "c-bri" && i !== S.idxPonte ? "opacity:.45" : ""}"/>
        <text class="val fade" x="${x(i)}" y="${base - h - 12}" style="--d:${d + 500}ms;font-size:19px">${val}</text>
        <text class="mon ${S.idxAtual.includes(i) ? "now" : ""}" x="${x(i)}" y="${base + 30}" style="font-size:17px">${S.serie[i].m}</text>`;
      if (i) {
        const t = pct(val, v[i - 1]), up = val >= v[i - 1], w = t.length * 7.8 + 14, py = base + 44;
        s += `<g class="fade" style="--d:${d + 700}ms"><rect x="${x(i) - w / 2}" y="${py}" width="${w}" height="24" rx="6" fill="${up ? "var(--accent)" : "#33405e"}"/>
          <text class="pill-t" x="${x(i)}" y="${py + 17}" style="font-size:12.5px">${t}</text></g>`;
      } else s += `<text class="mt fade" x="${x(i)}" y="${base + 62}" text-anchor="middle" fill="#596076" font-size="13" style="--d:${d + 700}ms">—</text>`;
    });
    const bracket = (a, b, txt, cor, d) => {
      const x1 = x(a) - bw / 2, x2 = x(b) + bw / 2, y = 96;
      return `<path class="brk draw" pathLength="1" d="M${x1},${y + 14} L${x1},${y} L${x2},${y} L${x2},${y + 14}" stroke="${cor}" style="--d:${d}ms"/>
        <text class="fade" x="${(x1 + x2) / 2}" y="${y - 12}" text-anchor="middle" font-size="20" font-weight="800" fill="${cor}" style="--d:${d + 400}ms">${txt}</text>`;
    };
    s += bracket(S.idxAnterior[0], S.idxAnterior.at(-1), "média " + br(mA), "#b8c6e6", 900);
    s += bracket(S.idxAtual[0], S.idxAtual.at(-1), "média " + br(mN) + " · " + pct(mN, mA), "#ffffff", 1100);
    const jul = v[S.idxPonte];
    return { label: "I.A SDR · Atendimentos", cor: S.cor, html: `
      <div class="inner split">
        <aside>
          <div class="kicker a" style="--d:0ms"><i></i>I.A SDR · Atendimentos</div>
          <span class="big a" style="--d:120ms">${cnt(mN, { txt: br(mN) })}<small> /mês</small></span>
          <p class="desc a" style="--d:260ms">atendimentos da I.A SDR por mês, na média de ago a out</p>
          <div class="delta a" style="--d:380ms">▲ ${cnt((mN / mA - 1) * 100, { dec: 1, pre: "+", suf: "%", txt: pct(mN, mA) })} vs abr–jun (média ${br(mA)})</div>
          <div class="facts">
            <div class="fact hl a" style="--d:500ms"><b>Jul · ${jul}</b><span>maior mês de 2026</span></div>
            <div class="fact a" style="--d:620ms"><b>${br(S.totalAcumulado)}</b><span>atendimentos desde ${esc(S.desde)} · média de ${S.mediaAno}/mês</span></div>
          </div>
        </aside>
        <div>
          <svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Atendimentos da I.A SDR por mês, de novembro a outubro">${s}</svg>
          <div class="legend a" style="--d:900ms"><span><i style="background:var(--ant)"></i>abr–jun</span><span><i style="background:var(--bri)"></i>jul (ponte)</span><span><i style="background:var(--accent)"></i>ago–out</span><span>% = variação vs mês anterior</span><span>linha tracejada = média dos 12 meses (${S.mediaAno})</span></div>
          <p class="fonte a" style="--d:1000ms">Atendimentos da I.A SDR (GRX) por mês, de nov/25 a out/26. Nov sem variação: o mês anterior (out/25) só tem dados desde o dia 23.</p>
        </div>
      </div>` };
  }

  /* ---------- Bloco 3 · sistemas ---------- */
  const SS = D.sistemas;
  const kick = t => `<div class="kicker a" style="--d:0ms"><i></i>${t}</div>`;
  const fact = (b, t, d, hl) => `<div class="fact ${hl ? "hl" : ""} a" style="--d:${d}ms"><b>${b}</b><span>${t}</span></div>`;
  const sl = (label, cor, aside, right) => ({ label, cor, html: `<div class="inner split"><aside>${aside}</aside><div>${right}</div></div>` });
  const legend = (items, d = 900) => `<div class="legend a" style="--d:${d}ms">${items.join("")}</div>`;
  const fonte = (t, d = 1000) => `<p class="fonte a" style="--d:${d}ms">${t}</p>`;
  const pls = (v, pp) => v.map((x, i) => i ? (pp ? { t: (x - v[i - 1] >= 0 ? "+" : "−") + br(Math.abs(x - v[i - 1]), 1) + " p.p.", up: x >= v[i - 1] } : { t: pct(x, v[i - 1]), up: x >= v[i - 1] }) : null);
  const hrow = (nome, em, val, w, d, cls = "") => `<div class="hb ${cls} a" style="--d:${d}ms"><div class="top2"><span class="nm">${esc(nome)}${em ? `<em>${esc(em)}</em>` : ""}</span><span class="ct">${val}</span></div><div class="track"><i style="--w:${w.toFixed(3)};--d:${d}ms"></i></div></div>`;

  // gráfico de colunas genérico (opção v2 = segunda pilha em dourado)
  function cols(o) {
    const W = 1000, vals = o.vals, n = vals.length, step = W / n, base = o.base || 310, top = 120, bw = o.bw || Math.min(110, step * .62);
    const v2 = o.v2 || null, tot = vals.map((v, i) => v + (v2 ? v2[i] : 0)), max = o.max || Math.max(...tot) * 1.1;
    const x = i => step * i + step / 2, hh = v => v / max * (base - top);
    let s = "";
    vals.forEach((v, i) => {
      const h = hh(v), d = i * 110; let yt = base - h;
      s += `<rect class="bar ${o.cl ? o.cl(i) : "c-acc"}" x="${x(i) - bw / 2}" y="${base - h}" width="${bw}" height="${h}" rx="6" style="--d:${d}ms"/>`;
      if (v2) { const h2 = hh(v2[i]); s += `<rect class="bar c-gold" x="${x(i) - bw / 2}" y="${base - h - h2}" width="${bw}" height="${h2}" rx="4" style="--d:${d + 200}ms"/>`; yt -= h2; }
      s += `<text class="val fade" x="${x(i)}" y="${yt - 14}" style="--d:${d + 500}ms">${o.fv(tot[i])}</text>
        <text class="mon ${o.now && o.now(i) ? "now" : ""}" x="${x(i)}" y="${base + 34}">${esc(o.labs[i])}</text>`;
      const p = o.pl && o.pl[i];
      if (p) s += pill(x(i), base + 50, p.t, p.up).replace('class="fade"', `class="fade" style="--d:${d + 700}ms"`);
    });
    (o.bk || []).forEach((b, j) => {
      const x1 = x(b.a) - bw / 2, x2 = x(b.b) + bw / 2, y = 66, d = 900 + j * 200;
      s += `<path class="brk draw" pathLength="1" d="M${x1},${y + 14} L${x1},${y} L${x2},${y} L${x2},${y + 14}" stroke="${b.cor || "#fff"}" style="--d:${d}ms"/>
        <text class="fade" x="${(x1 + x2) / 2}" y="${y - 12}" text-anchor="middle" font-size="22" font-weight="800" fill="${b.cor || "#fff"}" style="--d:${d + 400}ms">${b.t}</text>`;
    });
    return `<svg class="chart" viewBox="0 0 ${W} ${base + (o.pl ? 90 : 56)}" role="img" aria-label="${esc(o.aria)}">${s}</svg>`;
  }

  function agend() {
    const A = SS.agend, a = A.agendados, c = A.conv, q = A.sequencia, tri = a[2] + a[3] + a[4];
    const svg = cols({ vals: a, labs: A.meses, fv: v => br(v), cl: i => i < 2 ? "c-ant" : "c-acc", now: i => i >= 2, pl: pls(a),
      bk: [{ a: 2, b: 4, t: pct(a[4], a[2]) + " de ago a out" }], aria: "Agendamentos fechados por mês" });
    return sl("Agendamentos", A.cor, `
      ${kick("Agendamentos · Automação")}
      <span class="big md a" style="--d:120ms">${cnt(tri, { txt: br(tri) })}</span>
      <p class="desc a" style="--d:260ms">agendamentos fechados no trimestre, de ${br(A.clientes)} clientes atendidos: <b style="color:var(--accent)">${br(A.convTri, 1)}% de taxa de sucesso</b></p>
      <div class="delta a" style="--d:380ms">▲ ${pct(a[4], a[2])} de ago a out (${a[2]} → ${a[4]} por mês)</div>
      <div class="facts">
        ${fact(q.dias + " dias", `seguidos com 100% de clientes agendados (${q.de} a ${q.ate}, ${q.clientes} clientes). Recorde anterior: ${q.recorde} dias`, 500, true)}
        ${fact(br(c[4], 1) + "%", `de conversão em outubro, contra ${br(c[2], 1)}% em agosto`, 620)}
      </div>`,
      `${svg}${legend(['<span><i style="background:var(--ant)"></i>jun–jul (antes do trimestre)</span>', '<span><i style="background:var(--accent)"></i>ago–out</span>', "<span>% = variação vs mês anterior</span>"])}
       ${fonte("Agendamentos fechados por mês. A sequência de 100% segue em andamento.")}`);
  }

    const C = SS.crm, m = C.mensal, pa = C.auto / C.total * 100;
    const svg = cols({ vals: m, labs: ["Ago", "Set", "Out"], fv: v => br(v), pl: pls(m), now: () => true, base: 270, aria: "Atendimentos abertos no Kommo por mês" });
    return sl("CRM Kommo", C.cor, `
      ${kick("CRM Kommo · Atendimentos")}
      <span class="big md a" style="--d:120ms">${cnt(C.auto, { txt: br(C.auto) })}</span>
      <p class="desc a" style="--d:260ms">atendimentos abertos pela automação no trimestre</p>
      <div class="delta a" style="--d:380ms">▲ ${br(pa, 1)}% de todos os atendimentos (${br(C.total)})</div>
      <div class="facts">
        ${fact(C.mediaDia + "/dia", `atendimentos abertos no Kommo, ${pct(m[1], m[0])} de ago para set`, 500, true)}
        ${fact(C.funis, "funis ativos: vendas, suporte e cobrança", 620)}
      </div>`,
      `${svg}
       <div class="sbar a" style="--d:900ms"><span style="--w:${pa.toFixed(1)}%;background:var(--accent);color:#1a0d00">${br(pa, 1)}% automação · ${br(C.auto)}</span><span style="--w:${(100 - pa).toFixed(1)}%;background:#33405e">${br(100 - pa, 1)}% pessoa · ${br(C.pessoa)}</span></div>
       ${fonte("Atendimentos abertos por mês. A barra mostra quanto do total nasceu de uma automação, sem ação humana.", 1100)}`);
  }

  function lara() {
    const L = SS.lara, m = L.mensal, dem = L.total - L.boleto - L.negoc;
    const svg = cols({ vals: m, labs: ["Ago", "Set", "Out"], fv: v => br(v), pl: pls(m), now: () => true, base: 250, aria: "Atendimentos da Lara Back-office por mês" });
    return sl("Lara Back-office", L.cor, `
      ${kick("Lara · IA back-office no WhatsApp")}
      <span class="big md a" style="--d:120ms">${cnt(L.total, { txt: br(L.total) })}</span>
      <p class="desc a" style="--d:260ms">atendimentos no trimestre, 24h por dia</p>
      <div class="delta a" style="--d:380ms">▲ ${pct(m[1], m[0])} de ago para set</div>
      <div class="facts">
        ${fact(L.porDia + "/dia", `por dia útil (em agosto: ${L.porDiaAgo})`, 500, true)}
        ${fact(br(L.negoc), `negociações e acordos fechados (${br(L.negoc / L.total * 100, 1)}%)`, 620)}
        ${fact(br(L.fimSemana), "atendimentos em fim de semana e feriado", 740)}
      </div>`,
      `${svg}
       <div class="hbars tight" style="margin-top:14px">
         ${hrow("Boleto / 2ª via", br(L.boleto / L.total * 100, 1) + "% dos pedidos", br(L.boleto), L.boleto / L.total, 900)}

       </div>
       ${fonte("Atendimentos recebidos pela Lara Back-office por mês, e tipo de pedido no trimestre.", 1200)}`);

  function cobr() {
    const C = SS.cobr, m = C.mensal, tot = m.reduce((a, b) => a + b, 0);
    const svg = cols({ vals: m, labs: ["Ago", "Set", "Out"], fv: x => br(x), pl: pls(m), now: () => true,

      <p class="desc a" style="--d:260ms">boletos emitidos e enviados pela automação no trimestre</p>
      <div class="delta a" style="--d:380ms">▲ ${pct(m[2], m[0])} de ago a out (${br(m[0])} → ${br(m[2])} por mês)</div>

  function rast() {
    const R = SS.rast, I = R.inst, A = R.ativ, p = I.pedidosMes, tot = p.reduce((a, b) => a + b, 0);
    const ext = SS.agend.agendados.slice(2).reduce((a, b) => a + b, 0);
    const svg = cols({ vals: p, labs: ["Ago", "Set", "Out"], fv: v => br(v), now: () => true, pl: pls(p),
      bk: [{ a: 0, b: 2, t: pct(p[2], p[0]) + " de ago a out" }], aria: "Pedidos de instalação acompanhados por mês" });
    return sl("Painel de Instalações RESOLVE", R.cor, `
      ${kick("Painel de Instalações RESOLVE")}
      <span class="big md a" style="--d:120ms">${cnt(tot, { txt: br(tot) })}</span>
      <p class="desc a" style="--d:260ms">pedidos de instalação acompanhados em tempo real pelo painel da T.I.</p>
      <div class="delta a" style="--d:380ms">▲ ${pct(p[2], p[0])} de ago a out (${p[0]} → ${p[2]} por mês)</div>

         <li><b>Substituiu:</b> uma planilha confusa, que ajudava pouco na operação</li>
         <li><b>Ganho:</b> melhor visualização e acompanhamento dos clientes</li>

         <li><b>Ativação:</b> só set e out, agosto não consta no painel</li>
         <li><b>Diferença:</b> ${br(tot - ext)} acima dos ${br(ext)} agendamentos externos são os internos, <b style="color:var(--accent)">${pct(tot, ext)}</b></li>
       </ul></div>`);

      ${row("TMA", "chegada → conclusão", T.rot, "▼ " + T.varTri + " (" + T.anterior + ")", true)}
      ${row("TME", "chegada → início", E.min.map(x => x + " min"), "▲ " + E.varTri + " (" + E.anterior + " min)", false)}
      ${row("SLA estourado", "concluídos fora do prazo", S.pct.map(x => br(x, 1) + "%"), "▼ " + S.varPP + " (" + br(S.anterior, 1) + "%)", true)}</div>`;
    return sl("Recepção · Tempos", R.cor, `
      ${kick("Recepção · Tempos de atendimento")}
      <span class="big md a" style="--d:120ms">${cnt(T.min.reduce((a, b) => a + b, 0) / 3 | 0, { fmt: "hm", txt: T.media })}</span>
      <p class="desc a" style="--d:260ms">TMA médio: da chegada do cliente até a conclusão</p>
      <div class="delta a" style="--d:380ms">▼ ${T.varTri} vs mai–jul (${T.anterior})</div>
      <div class="facts">
        ${fact(E.media + " min", `TME médio até o início do atendimento. Subiu de ${E.min[0]} para ${E.min[2]} min no trimestre, o único indicador que piorou`, 500, true)}
        ${fact(br(S.media, 1) + "%", `dos concluídos acima do prazo do serviço (SLA). Melhor mês: out, com ${br(S.pct[2], 1)}%`, 620)}
      </div>`,
      `${grid}${legend(['<span><i style="background:var(--accent)"></i>melhora vs mai–jul</span>', '<span><i style="background:#ffd24a"></i>piora vs mai–jul</span>'], 900)}
       ${fonte("Recepção Matriz, relatório de 10/11/2026. TMA: chegada até conclusão. TME: chegada até início. SLA estourado: concluídos acima do prazo do serviço.", 1000)}`);
  }

  const slides = [capa(), chamados(), categorias(), nps(), tma(), patrimonio(),
    trans("Transição · Custos", CU.cor, "Próximo bloco", "Custos", "e Infraestrutura", "Ferramentas, I.A e infra: quanto custa manter a operação."),
    custoGeral(), custoServicos(), custoComp(), metaCusto(),
    trans("Transição · I.A", "#a78bfa", "Próximo bloco", "Inteligência", "Artificial", "As I.As em operação: I.A SDR (GRX) e Lara."),
    iaSdr(), lara(),
    trans("Transição · Automações", "#2dd4bf", "Próximo bloco", "Automações", "e Sistemas", "Agendamentos, cobrança RESOLVE e painel de instalações."),
    agend(), cobr(), rast(), /* bloq() oculto por enquanto: para voltar, reinserir bloq() aqui, depois de rast() */
    crm(), recA(), npsCli(), disp(), msg(),
    trans("Transição · Entregas", "#fbbf24", "Entregas do trimestre", "9 sistemas", "entregues", "Ago a Out: o que a T.I colocou no ar para a operação."),
    entregas(),
    fim()]  // recB() (tempos da recepção) fica fora: é desempenho da área;

  /* ---------- contadores ---------- */
  const fmtCount = (c, v) => {
    if (c.dataset.fmt === "hm") return hm(v);
    return (c.dataset.pre || "") + br(v, +c.dataset.dec || 0) + (c.dataset.suf || "");
  };
  function runCounts(el) {
    el.querySelectorAll(".cnt").forEach(c => {
      cancelAnimationFrame(c._r);
      const SP = parseFloat(getComputedStyle(document.documentElement).getPropertyValue("--sp")) || 1;
      const to = +c.dataset.to, t0 = performance.now() + 450 * SP, dur = 1500 * SP;
      c.textContent = fmtCount(c, 0);
      const tick = now => {
        const p = Math.min(1, Math.max(0, (now - t0) / dur)), e = 1 - Math.pow(1 - p, 3);
        c.textContent = fmtCount(c, to * e);
        if (p < 1) c._r = requestAnimationFrame(tick);
      };
      c._r = requestAnimationFrame(tick);
      // garantia: se o navegador pausar o rAF (aba em segundo plano), o valor final entra por timer
      clearTimeout(c._t);
      c._t = setTimeout(() => { cancelAnimationFrame(c._r); c.textContent = fmtCount(c, to); }, 450 * SP + dur + 150);
    });
  }

  /* ---------- render ---------- */
  const deck = document.getElementById("deck"), prog = document.getElementById("progress");
  const root = document.documentElement, scan = document.querySelector(".bg .scan");
  document.getElementById("brandTxt").textContent = `${D.equipe} · ${D.empresa}`;
  deck.innerHTML = slides.map((s, i) => `<section class="slide" data-i="${i}" aria-label="${esc(s.label)}">${s.html}</section>`).join("");
  prog.innerHTML = slides.map((s, i) => `<button style="--c:${s.cor}" title="${esc(s.label)}" aria-label="Ir para ${esc(s.label)}" data-goto="${i}"></button>`).join("");
  const els = [...deck.children], bars = [...prog.children];

  let cur = -1;
  function go(n) {
    n = Math.max(0, Math.min(slides.length - 1, n));
    if (n === cur) return;
    cur = n;
    els.forEach((el, i) => { el.classList.toggle("on", i === n); el.classList.toggle("past", i < n); });
    bars.forEach((b, i) => { b.classList.toggle("done", i < n); b.classList.toggle("cur", i === n); });
    root.style.setProperty("--accent", slides[n].cor);
    document.getElementById("whereTxt").textContent = slides[n].label;
    document.getElementById("countTxt").textContent = `${pad(n + 1)} / ${pad(slides.length)}`;
    scan.classList.remove("go"); void scan.offsetWidth; scan.classList.add("go");
    runCounts(els[n]);
    history.replaceState(null, "", "#" + (n + 1));
  }
  const next = () => go(cur + 1), prev = () => go(cur - 1);
  const full = () => { if (!document.fullscreenElement) document.documentElement.requestFullscreen?.(); else document.exitFullscreen?.(); };

  document.getElementById("next").onclick = next;
  document.getElementById("prev").onclick = prev;
  document.getElementById("full").onclick = full;
  document.addEventListener("click", e => { const t = e.target.closest("[data-goto]"); if (t) go(+t.dataset.goto); });
  document.addEventListener("keydown", e => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const k = e.key;
    if (["ArrowRight", "PageDown", " ", "Enter"].includes(k)) { e.preventDefault(); next(); }
    else if (["ArrowLeft", "PageUp", "Backspace"].includes(k)) { e.preventDefault(); prev(); }
    else if (k === "Home") go(0);
    else if (k === "End") go(slides.length - 1);
    else if (k.toLowerCase() === "f") full();
    else if (/^[1-9]$/.test(k)) go(+k - 1);
  });
  let tx = null;
  deck.addEventListener("touchstart", e => { tx = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", e => { if (tx == null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) dx < 0 ? next() : prev(); tx = null; });
  const fromHash = () => { const n = parseInt(location.hash.slice(1), 10); return Number.isFinite(n) ? n - 1 : 0; };
  window.addEventListener("hashchange", () => go(fromHash()));
  setTimeout(() => go(fromHash()), 60); // timer (não rAF): também dispara com a aba em segundo plano
})();
</script>
</body>
