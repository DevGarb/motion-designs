name: Publicar no GitHub Pages

# Junta as branches num site só:
#   /                       -> índice (main)
#   /grti-motion/           -> branch grti-motion
#   /treinamento-sistemas/  -> branch treinamento-sistemas
#   /roteirizador-frotas/   -> branch roteirizador-frotas
#   /konfia-encontro-01/    -> branch konfia-encontro-01
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: hub }
      - uses: actions/checkout@v4
        with: { ref: grti-motion, path: grti-motion }
      - uses: actions/checkout@v4
        with: { ref: treinamento-sistemas, path: treinamento-sistemas }
      - uses: actions/checkout@v4
        with: { ref: roteirizador-frotas, path: roteirizador-frotas }
      - uses: actions/checkout@v4
        with: { ref: konfia-encontro-01, path: konfia-encontro-01 }
      - name: Montar site
        run: |
          mkdir -p _site
          cp hub/index.html _site/
          rsync -a --exclude .git --exclude .github grti-motion/ _site/grti-motion/
          rsync -a --exclude .git --exclude .github treinamento-sistemas/ _site/treinamento-sistemas/
          rsync -a --exclude .git --exclude .github --exclude design roteirizador-frotas/ _site/roteirizador-frotas/
          rsync -a --exclude .git --exclude .github konfia-encontro-01/ _site/konfia-encontro-01/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with: { path: _site }
      - id: deployment
        uses: actions/deploy-pages@v4
